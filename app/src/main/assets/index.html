<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ScanPrint</title>
<style>
:root{--bg:#f3f4f6;--sf:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#2f6fed;--acs:#e8f0fe;--bd:#e3e6ea;--ok:#188038;--wr:#b45309;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overscroll-behavior:none}
.screen{position:fixed;inset:0;height:100dvh;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--sf);border-bottom:1px solid var(--bd);min-height:60px}
.top h1{font-size:18px;font-weight:600;margin:0;flex:1}
.logo{display:flex;align-items:center;gap:10px;flex:1;font-weight:700;font-size:19px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--ac);display:grid;place-items:center}
.logo svg{width:20px;height:20px;fill:#fff}
.scroll{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.ic{width:22px;height:22px;fill:currentColor;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer}
.iconbtn:active{background:var(--bd)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.btn{height:52px;border-radius:14px;border:0;font:600 16px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;cursor:pointer;background:var(--acs);color:var(--ac);width:100%}
.btn.primary{background:var(--ac);color:#fff}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.plain{background:#eceef2;color:var(--tx)}
.btn.danger{background:#fdecec;color:#c5221f}
.btn:disabled{opacity:.45}
.btn:active{filter:brightness(.94)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{background:var(--sf);border:2px solid var(--bd);border-radius:var(--r);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--mu);position:relative}
.tcard .ic{width:30px;height:30px}
.tcard.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.tcard.on::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.muted{color:var(--mu);font-size:13px}
h2{font-size:15px;margin:0;font-weight:600}
.slot{display:flex;flex-direction:column;gap:12px}
.slotHead{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mu);text-align:center}
.drop .ic{width:34px;height:34px;color:var(--ac)}
.thumbbox{background:repeating-conic-gradient(#f0f1f3 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:12px;display:grid;place-items:center;padding:8px;border:1px solid var(--bd)}
.thumbbox img{max-width:100%;max-height:200px;display:block;border-radius:4px;box-shadow:0 1px 4px #0003}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:#cfd3d9;border:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px #0004}
.switch.on{background:var(--ac)}.switch.on::after{left:23px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:8px}
.item img{width:54px;height:54px;object-fit:contain;background:#f0f1f3;border-radius:8px}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item .iconbtn{width:38px;height:38px}
.bar{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--bd);display:flex;gap:10px;flex-direction:column}
.bar.hide{display:none}
.seg{display:flex;background:#eceef2;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font:600 13.5px inherit;font-family:inherit;color:var(--mu);cursor:pointer}
.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 3px #0002}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu)}
select,input[type=number]{height:46px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;font:15px inherit;font-family:inherit;background:#fff;color:var(--tx);width:100%}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.rg{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;font-size:13.5px}
.rg input{grid-column:1/3}
.rg b{color:var(--ac);font-weight:600}
.stagewrap{flex:1;min-height:200px;position:relative;background:#e6e8ec;overflow:hidden}
#stage,#layCanvas,#expCanvas{touch-action:none;display:block}
#stage{position:absolute;inset:0;width:100%;height:100%}
.tools{background:var(--sf);border-top:1px solid var(--bd);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.trow::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;background:#f3f4f6;border:0;border-radius:12px;padding:8px 12px;min-width:68px;font:600 11.5px inherit;font-family:inherit;color:var(--tx);cursor:pointer}
.tb.on{background:var(--acs);color:var(--ac)}
.tb .ic{width:22px;height:22px}
.chip{flex:none;border:1.5px solid var(--bd);background:#fff;border-radius:20px;padding:8px 14px;font:600 13px inherit;font-family:inherit;color:var(--tx);cursor:pointer}
.chip.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
.hint{font-size:12.5px;color:var(--mu);text-align:center;padding:0 4px}
.prev{flex:1;min-height:160px;display:grid;place-items:center;padding:12px;overflow:hidden;background:#e6e8ec}
.prev canvas{background:#fff;box-shadow:0 2px 14px #0003;border-radius:2px}
.panel{background:var(--sf);border-top:1px solid var(--bd);padding:12px 16px;max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pgs{display:flex;gap:6px;justify-content:center;padding:6px;background:#e6e8ec;overflow-x:auto}
.warn{background:#fff4e5;color:var(--wr);border-radius:12px;padding:9px 12px;font-size:13px}
.info{background:var(--acs);color:#1a4fb8;border-radius:12px;padding:9px 12px;font-size:13px}
.copies{display:flex;align-items:center;gap:6px}
.copies b{min-width:22px;text-align:center}
.copies .iconbtn{width:34px;height:34px;background:#eceef2}
.exp{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1}
.expcv{display:grid;place-items:center;background:#e6e8ec;border-radius:14px;padding:12px}
.expcv canvas{box-shadow:0 2px 14px #0003;background:#fff;max-width:100%}
.tip{font-size:13px;color:var(--mu);line-height:1.5}
.tip b{color:var(--tx)}
#loader{position:fixed;inset:0;background:#fffc;backdrop-filter:blur(3px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;font-weight:600}
#loader.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--acs);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#202124;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.flip{transform:scaleX(-1)}
#printArea{display:none}
@page port{size:210mm 297mm;margin:0}
@page land{size:297mm 210mm;margin:0}
@media print{
 html,body{height:auto!important;background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 .pp{display:block;break-after:page}
 .pp.port{page:port;width:210mm;height:297mm}
 .pp.land{page:land;width:297mm;height:210mm}
 .pp:last-child{break-after:auto}
}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen active" id="s-home">
  <div class="top">
    <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M4 4h5v2H6v3H4V4zm11 0h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3zM7 11h10v2H7z"/></svg></i>ScanPrint</div>
    <button class="iconbtn" data-a="settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
  </div>
  <div class="scroll" id="homeBody"></div>
  <div class="bar hide" id="homeBar"><button class="btn primary" data-a="next" id="nextBtn"></button></div>
</section>

<!-- EDITOR -->
<section class="screen" id="s-editor">
  <div class="top">
    <button class="iconbtn" data-a="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1 id="edTitle">Edit</h1>
    <button class="btn sm plain" data-a="edReset">Reset</button>
  </div>
  <div class="stagewrap"><canvas id="stage"></canvas></div>
  <div class="tools">
    <div class="hint" id="edHint"></div>
    <div class="seg" id="edTabs"><button data-a="edTab" data-t="adjust" class="on">Corners</button><button data-a="edTab" data-t="result">Result</button></div>
    <div id="zoomRow" class="rg" style="display:none"><span>Zoom</span><b id="zoomVal">100%</b><input type="range" id="zoomSl" min="1" max="4" step="0.01" value="1"></div>
    <div class="trow" id="edTools"></div>
    <div class="trow" id="edModes"></div>
  </div>
  <div class="bar"><button class="btn primary" data-a="back">Done</button></div>
</section>

<!-- LAYOUT -->
<section class="screen" id="s-layout">
  <div class="top">
    <button class="iconbtn" data-a="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1>A4 layout</h1>
    <button class="btn sm plain" data-a="autoLayout">Auto arrange</button>
  </div>
  <div class="prev" id="layPrev"><canvas id="layCanvas"></canvas></div>
  <div class="pgs" id="layPages"></div>
  <div class="panel" id="layPanel"></div>
  <div class="bar"><button class="btn primary" data-a="toExport">Preview &amp; export</button></div>
</section>

<!-- EXPORT -->
<section class="screen" id="s-export">
  <div class="top">
    <button class="iconbtn" data-a="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1>Export</h1>
  </div>
  <div class="exp">
    <div class="pgs" id="expPages" style="border-radius:12px"></div>
    <div class="expcv"><canvas id="expCanvas"></canvas></div>
    <div class="card tip" id="expTip"></div>
  </div>
  <div class="bar">
    <button class="btn primary" data-a="savePdf" id="pdfBtn"></button>
    <div class="row2">
      <button class="btn sm" data-a="saveImg" id="imgBtn"></button>
      <button class="btn sm" data-a="share" id="shareBtn"></button>
      <button class="btn sm" data-a="print" id="printBtn"></button>
    </div>
  </div>
</section>

<!-- SETTINGS -->
<section class="screen" id="s-settings">
  <div class="top">
    <button class="iconbtn" data-a="back" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1>Settings</h1>
  </div>
  <div class="scroll">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2>ID card size</h2>
      <label class="f">Preset<select id="idPreset"></select></label>
      <div class="row2">
        <label class="f">Width (mm)<input type="number" id="idW" step="0.1" min="20" max="280" data-bind="S.settings.idW"></label>
        <label class="f">Height (mm)<input type="number" id="idH" step="0.1" min="20" max="280" data-bind="S.settings.idH"></label>
      </div>
      <div class="muted">Used for "Actual size" printing. Standard cards are 85.6 × 54 mm.</div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2>Export</h2>
      <label class="f">PDF / JPEG quality
        <select id="qual"><option value="0.82">Good (smaller file)</option><option value="0.92">High</option><option value="0.98">Maximum</option></select></label>
      <div class="slotHead"><span>Cutting guides around cards &amp; photos</span><button class="switch" id="guideSw"></button></div>
    </div>
    <div class="muted" style="text-align:center">All processing happens on your device. Nothing is uploaded.</div>
  </div>
</section>

<div id="loader"><div class="spin"></div><div id="loaderText">Working…</div></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<div id="printArea"></div>

/* ============ perspective warp ============ */
function solve8(A,b){
  const n=8;
  for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;
    [A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}
  return x;
}
function warp(src,p,kind,max){

  if(w<4||h<4)return src;
  const r=w/h,tr=kind==='id'?S.settings.idW/S.settings.idH:210/297;
  const target=r>=1?Math.max(tr,1/tr):Math.min(tr,1/tr);
  if(Math.abs(r/target-1)<(kind==='id'?0.22:0.08))h=w/target;
  const sc=Math.min(1,max/Math.max(w,h));
  const W=Math.max(2,Math.round(w*sc)),H=Math.max(2,Math.round(h*sc));
  const dst=[{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  const A=[],b=[];
  for(let i=0;i<4;i++){const {x,y}=dst[i],{x:u,y:v}=p[i];
    A.push([x,y,1,0,0,0,-x*u,-y*u]);b.push(u);
    A.push([0,0,0,x,y,1,-x*v,-y*v]);b.push(v);}
  const H8=solve8(A,b);
  if(H8.some(v=>!isFinite(v)))return src;
  const [h1,h2,h3,h4,h5,h6,h7,h8]=H8;
  const sw=src.width,sh=src.height;
  const sd=src.getContext('2d',{willReadFrequently:true}).getImageData(0,0,sw,sh).data;

      const w00=(1-fx)*(1-fy),w10=fx*(1-fy),w01=(1-fx)*fy,w11=fx*fy,o=(y*W+x)*4;
      od[o]=sd[i]*w00+sd[i+4]*w10+sd[j]*w01+sd[j+4]*w11;
      od[o+1]=sd[i+1]*w00+sd[i+5]*w10+sd[j+1]*w01+sd[j+5]*w11;
      od[o+2]=sd[i+2]*w00+sd[i+6]*w10+sd[j+2]*w01+sd[j+6]*w11;
      od[o+3]=255;
    }

}

function enhance(c,mode,kind){

const E={item:null,tab:'adjust',g:null,drag:-1,off:{x:0,y:0},ptrs:new Map(),pinch:0,pan:null};

function tileSize(){
  let w=Math.max(5,S.photo.w||35),h=Math.max(5,S.photo.h||45);

}
function zoomMin(it){
  if(!it.fit)return 1;

}
function syncEditor(){

function resetEditor(){

let procT;

}
function drawPhoto(ctx,it,x,y,w,h,img){
  img=img||it.base||it.preview;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);
  const cover=Math.max(w/img.width,h/img.height),contain=Math.min(w/img.width,h/img.height);
  const zmin=it.fit?contain/cover:1,z=clamp(it.crop.zoom,zmin,4);
  const s=cover*z,iw=img.width*s,ih=img.height*s;
  const mxx=Math.max(0,(iw-w)/2),myy=Math.max(0,(ih-h)/2);
  const cx=clamp(it.crop.x*w,-mxx,mxx),cy=clamp(it.crop.y*h,-myy,myy);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,x+w/2+cx-iw/2,y+h/2+cy-ih/2,iw,ih);
  ctx.restore();
}
function stageSize(){
  const cv=$('#stage'),wr=cv.parentElement,dpr=window.devicePixelRatio||1,W=wr.clientWidth,H=wr.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  return {cv,x,W,H};
}
function drawStage(){
  const it=E.item;if(!it||cur!=='editor')return;
  const {x,W,H}=stageSize();
  x.clearRect(0,0,W,H);
  if(it.kind==='photo'){
    const t=tileSize(),pad=24,s=Math.min((W-pad*2)/t.w,(H-pad*2)/t.h),fw=t.w*s,fh=t.h*s,fx=(W-fw)/2,fy=(H-fh)/2;
    x.shadowColor='#0004';x.shadowBlur=14;x.fillStyle='#fff';x.fillRect(fx,fy,fw,fh);x.shadowBlur=0;
    drawPhoto(x,it,fx,fy,fw,fh,it.preview);
    x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1;x.beginPath();
    for(let i=1;i<3;i++){x.moveTo(fx+fw*i/3,fy);x.lineTo(fx+fw*i/3,fy+fh);x.moveTo(fx,fy+fh*i/3);x.lineTo(fx+fw,fy+fh*i/3);}
    x.stroke();x.strokeStyle='#2f6fed';x.lineWidth=2;x.strokeRect(fx,fy,fw,fh);
    E.g={fx,fy,fw,fh};return;
  }
  if(E.tab==='adjust'){
    const im=it.src,pad=22,s=Math.min((W-pad*2)/im.width,(H-pad*2)/im.height),iw=im.width*s,ih=im.height*s,ox=(W-iw)/2,oy=(H-ih)/2;
    x.drawImage(im,ox,oy,iw,ih);E.g={ox,oy,s};
    const P=it.corners.map(p=>({x:ox+p.x*s,y:oy+p.y*s}));
    x.save();x.beginPath();x.rect(ox,oy,iw,ih);x.moveTo(P[0].x,P[0].y);for(let i=3;i>=0;i--)x.lineTo(P[i].x,P[i].y);x.closePath();
    x.fillStyle='rgba(0,0,0,.35)';x.fill('evenodd');x.restore();
    x.beginPath();P.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();
    x.strokeStyle='#2f6fed';x.lineWidth=2.5;x.stroke();
    P.forEach(p=>{x.beginPath();x.arc(p.x,p.y,13,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=3.5;x.strokeStyle='#2f6fed';x.stroke();});
  }else{
    const im=it.preview,pad=22,s=Math.min((W-pad*2)/im.width,(H-pad*2)/im.height),iw=im.width*s,ih=im.height*s;
    x.shadowColor='#0004';x.shadowBlur=14;x.fillStyle='#fff';x.fillRect((W-iw)/2,(H-ih)/2,iw,ih);x.shadowBlur=0;
    x.imageSmoothingQuality='high';x.drawImage(im,(W-iw)/2,(H-ih)/2,iw,ih);
  }
}
(function bindStage(){
  const cv=$('#stage');
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.addEventListener('pointerdown',e=>{
    const it=E.item;if(!it)return;cv.setPointerCapture(e.pointerId);const p=pos(e);E.ptrs.set(e.pointerId,p);
    if(it.kind==='photo'){
      if(E.ptrs.size===2){const [a,b]=[...E.ptrs.values()];E.pinch=Math.hypot(a.x-b.x,a.y-b.y);E.pz=it.crop.zoom;}
      E.pan=p;return;
    }
    if(E.tab!=='adjust')return;
    let best=-1,bd=44;
    it.corners.forEach((c,i)=>{const d=Math.hypot(E.g.ox+c.x*E.g.s-p.x,E.g.oy+c.y*E.g.s-p.y);if(d<bd){bd=d;best=i;}});
    E.drag=best;
    if(best>=0){const c=it.corners[best];E.off={x:E.g.ox+c.x*E.g.s-p.x,y:E.g.oy+c.y*E.g.s-p.y};}
  });
  cv.addEventListener('pointermove',e=>{
    const it=E.item;if(!it||!E.ptrs.has(e.pointerId))return;const p=pos(e);E.ptrs.set(e.pointerId,p);
    if(it.kind==='photo'){
      if(E.ptrs.size>=2){
        const [a,b]=[...E.ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
        if(E.pinch>0){it.crop.zoom=clamp(E.pz*d/E.pinch,zoomMin(it),4);syncZoom();}
      }else if(E.pan){it.crop.x+=(p.x-E.pan.x)/E.g.fw;it.crop.y+=(p.y-E.pan.y)/E.g.fh;E.pan=p;}
      drawStage();return;
    }
    if(E.drag>=0){
      const c=it.corners[E.drag];
      c.x=clamp((p.x+E.off.x-E.g.ox)/E.g.s,0,it.src.width);c.y=clamp((p.y+E.off.y-E.g.oy)/E.g.s,0,it.src.height);
      drawStage();
    }
  });
  const up=e=>{
    E.ptrs.delete(e.pointerId);if(E.ptrs.size<2)E.pinch=0;
    if(E.ptrs.size===1&&E.item&&E.item.kind==='photo')E.pan=[...E.ptrs.values()][0];
    if(!E.ptrs.size)E.pan=null;
    if(E.drag>=0){E.drag=-1;reprocess(false);}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{const it=E.item;if(it&&it.kind==='photo'){e.preventDefault();it.crop.zoom=clamp(it.crop.zoom*(e.deltaY<0?1.06:.94),zoomMin(it),4);syncZoom();drawStage();}},{passive:false});
  $('#zoomSl').addEventListener('input',e=>{const it=E.item;it.crop.zoom=Number(e.target.value);$('#zoomVal').textContent=Math.round(it.crop.zoom*100)+'%';drawStage();});
})();
function syncZoom(){const it=E.item,z=$('#zoomSl');z.min=zoomMin(it);z.value=it.crop.zoom;$('#zoomVal').textContent=Math.round(it.crop.zoom*100)+'%';}

/* ============ layout engine (mm units) ============ */
function pageDim(o){return o==='landscape'?{W:A4.h,H:A4.w}:{W:A4.w,H:A4.h};}
const rawOf=it=>it.base||it.preview;
function imgOf(it){
  const b=rawOf(it),m=L.mode[S.type];if(m==='original')return b;
  const e=it._e;if(e&&e.b===b&&e.m===m)return e.c;
  const c=enhance(b,m,it.kind);it._e={b,m,c};return c;
}
function photoCap(){
  const t=tileSize(),m=L.m.photo,{W,H}=pageDim(L.orient),gx=L.photo.gx,gy=L.photo.gy;
  const pw=W-2*m,ph=H-2*m;
  return {cols:Math.max(1,Math.floor((pw+gx+1e-6)/(t.w+gx))),rows:Math.max(1,Math.floor((ph+gy+1e-6)/(t.h+gy))),fits:t.w<=pw+1e-6&&t.h<=ph+1e-6,t,m,W,H,pw,ph};
}
function idGeom(){
  const cards=activeItems(),{W,H}=pageDim(L.orient),m=L.m.id,k=L.id.mode==='actual'?1:L.id.scale/100;
  const boxes=cards.map(c=>{
    let w=S.settings.idW*k,h=S.settings.idH*k;const b=rawOf(c);
    if((b.width>=b.height)!==(w>=h))[w,h]=[h,w];
    return {c,w,h};
  });
  const gap=L.id.gap,stack=L.id.arr==='stack';
  const gw=stack?Math.max(...boxes.map(b=>b.w)):boxes.reduce((a,b)=>a+b.w,0)+gap*(boxes.length-1);
  const gh=stack?boxes.reduce((a,b)=>a+b.h,0)+gap*(boxes.length-1):Math.max(...boxes.map(b=>b.h));
  const cols=Math.max(1,Math.floor((W-2*m+gap+1e-6)/(gw+gap))),rows=Math.max(1,Math.floor((H-2*m+gap+1e-6)/(gh+gap)));
  return {W,H,m,boxes,gap,stack,gw,gh,cols,rows,per:cols*rows};
}
function buildPages(){
  const G=S.settings.guides,pages=[];
  if(S.type==='id'){
    const g=idGeom(),{W,H,m,boxes,gap,stack,gw,gh,cols,per}=g;
    const total=Math.max(1,L.id.copies),np=Math.ceil(total/per);
    for(let p=0;p<np;p++){
      const kk=Math.min(per,total-p*per),c=Math.min(cols,kk),r=Math.ceil(kk/c);
      const Gw=c*gw+(c-1)*gap,Gh=r*gh+(r-1)*gap;
      const bx=L.id.align==='topleft'?m:(W-Gw)/2,by=L.id.align==='center'?(H-Gh)/2:m;
      let x=bx+L.id.dx,y=by+L.id.dy;
      x=Gw<=W-2*m+1e-6?clamp(x,m,W-m-Gw):(W-Gw)/2;
      y=Gh<=H-2*m+1e-6?clamp(y,m,H-m-Gh):m;
      if(p===0){L.id.dx=x-bx;L.id.dy=y-by;}
      const els=[];
      for(let s=0;s<kk;s++){
        const ox=x+(s%c)*(gw+gap),oy=y+((s/c)|0)*(gh+gap);let cx=ox,cy=oy;
        boxes.forEach(b=>{
          if(stack){els.push({canvas:imgOf(b.c),x:ox+(gw-b.w)/2,y:cy,w:b.w,h:b.h,fit:'contain',guide:G});cy+=b.h+gap;}
          else{els.push({canvas:imgOf(b.c),x:cx,y:oy+(gh-b.h)/2,w:b.w,h:b.h,fit:'contain',guide:G});cx+=b.w+gap;}
        });
      }
      const over=gw>W-2*m+.01||gh>H-2*m+.01;
      pages.push({W,H,els,m,drag:'id',warn:over?'Cards extend past the printable area. Reduce the scale, margin or gap, or switch to landscape / side by side.':''});
    }
  }else if(S.type==='a4'){
    const m=L.m.a4;
    S.a4.forEach(it=>{
      const b=imgOf(it),o=L.a4.orient==='auto'?(b.width>b.height?'landscape':'portrait'):L.a4.orient,{W,H}=pageDim(o);
      const pw=W-2*m,ph=H-2*m,els=[];let drag=null;
      if(L.a4.fit==='fill')els.push({canvas:b,x:m,y:m,w:pw,h:ph,fit:'cover'});
      else{
        const s=Math.min(pw/b.width,ph/b.height)*L.a4.scale/100,w=b.width*s,h=b.height*s;
        let x=(W-w)/2+it.pos.x,y=(H-h)/2+it.pos.y;
        if(w<=pw+1e-6)x=clamp(x,m,W-m-w);if(h<=ph+1e-6)y=clamp(y,m,H-m-h);
        it.pos.x=x-(W-w)/2;it.pos.y=y-(H-h)/2;
        els.push({canvas:b,x,y,w,h,fit:'contain'});drag={item:it};
      }
      pages.push({W,H,els,m,drag:drag?'a4':null,item:it,warn:''});
    });
  }else{
    const cap=photoCap(),{t,W,H,m,cols,rows}=cap,gx=L.photo.gx,gy=L.photo.gy,per=cols*rows;
    const tiles=[];S.photos.forEach(it=>{for(let i=0;i<it.copies;i++)tiles.push(it);});
    const np=Math.max(1,Math.ceil(tiles.length/per));
    for(let p=0;p<np;p++){
      const gw=cols*t.w+(cols-1)*gx,sx=L.photo.align==='center'?(W-gw)/2:m,els=[];
      tiles.slice(p*per,(p+1)*per).forEach((it,i)=>{
        const c=i%cols,r=(i/cols)|0;
        els.push({kind:'photo',it,x:sx+c*(t.w+gx),y:m+r*(t.h+gy),w:t.w,h:t.h,guide:G});
      });
      pages.push({W,H,els,m,drag:null,warn:cap.fits?'':'The photo size is larger than the printable area. Reduce the size or margins.'});
    }
  }
  return pages;
}
function renderPage(pg,ppm,overlay){
  const c=mk(pg.W*ppm,pg.H*ppm),x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';
  for(const e of pg.els){
    const X=e.x*ppm,Y=e.y*ppm,Wd=e.w*ppm,Hd=e.h*ppm;
    if(e.kind==='photo')drawPhoto(x,e.it,X,Y,Wd,Hd,imgOf(e.it));
    else{
      const b=e.canvas;
      if(e.fit==='cover'){
        const s=Math.max(Wd/b.width,Hd/b.height),sw=Wd/s,sh=Hd/s;
        x.drawImage(b,(b.width-sw)/2,(b.height-sh)/2,sw,sh,X,Y,Wd,Hd);
      }else{
        const s=Math.min(Wd/b.width,Hd/b.height),w=b.width*s,h=b.height*s;
        x.drawImage(b,X+(Wd-w)/2,Y+(Hd-h)/2,w,h);
      }
    }
    if(e.guide){x.strokeStyle='#b9bec6';x.lineWidth=Math.max(1,0.15*ppm);x.strokeRect(X,Y,Wd,Hd);}
  }
  if(overlay){
    x.save();x.setLineDash([6,5]);x.strokeStyle='rgba(47,111,237,.55)';x.lineWidth=1.2;
    x.strokeRect(pg.m*ppm,pg.m*ppm,(pg.W-2*pg.m)*ppm,(pg.H-2*pg.m)*ppm);x.restore();
  }
  return c;
}

/* ============ layout screen ============ */
const seg=(path,opts)=>`<div class="seg" data-seg="${path}">${opts.map(([v,l])=>`<button data-v="${v}" class="${get(path)==v?'on':''}">${l}</button>`).join('')}</div>`;
const range=(path,label,min,max,step,unit)=>`<label class="rg"><span>${label}</span><b data-val>${get(path)}${unit}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${get(path)}" data-bind="${path}" data-unit="${unit}"></label>`;
function renderLayoutControls(){
  const T=S.type;
  let h='<div class="muted">Enhance scan</div>'+seg('L.mode.'+T,[['original','Original'],['color','Color'],['gray','Grayscale'],['bw','B&W']]);
  if(T==='id'){
    h+=seg('L.id.mode',[['actual','Actual size'],['scaled','Scaled']]);
    h+=L.id.mode==='actual'
      ?`<div class="info">Actual size: ${S.settings.idW} × ${S.settings.idH} mm per card. Print at <b>100% / Actual size</b> (no “fit to page”).</div>`
      :`<div class="warn">Scaled: cards will NOT match their real physical size.</div>`+range('L.id.scale','Scale',30,150,1,'%');
    h+=seg('L.orient',[['portrait','Portrait'],['landscape','Landscape']]);
    h+=seg('L.id.arr',[['stack','Stacked'],['side','Side by side']]);
    const gg=idGeom();
    h+=`<div class="item" style="padding:8px 12px"><div class="nm"><b>Repeat on this page</b><span class="muted">copies of front + back · up to ${gg.per} fit</span></div>
      <div class="copies"><button class="iconbtn" data-a="idcopies" data-d="-1">${ic('minus')}</button><b>${L.id.copies}</b><button class="iconbtn" data-a="idcopies" data-d="1">${ic('plus')}</button></div>
      <button class="btn sm" data-a="idfill">Fill page</button></div>`;
    h+=seg('L.id.align',[['top','Top center'],['center','Center'],['topleft','Top left']]);
    h+=range('L.id.gap','Space between sides',0,40,1,' mm');
    h+=range('L.m.id','Margin',0,30,1,' mm');
    h+=`<div class="muted">Drag the cards on the page to reposition them.</div>`;
  }else if(T==='a4'){
    h+=seg('L.a4.fit',[['fit','Fit to page'],['fill','Fill page (crop)']]);
    h+=seg('L.a4.orient',[['auto','Auto'],['portrait','Portrait'],['landscape','Landscape']]);
    if(L.a4.fit==='fit')h+=range('L.a4.scale','Scale',30,100,1,'%');
    h+=range('L.m.a4','Margin',0,30,1,' mm');
    h+=`<div class="muted">${L.a4.fit==='fit'?'The whole page is kept, with its original proportions. Drag a page to move it.':'The page is enlarged to cover the sheet; edges may be cropped.'}</div>`;
  }else{
    const cap=photoCap(),t=cap.t,per=cap.cols*cap.rows;
    h+=`<div class="info">${t.w} × ${t.h} mm · ${per} per A4 page</div>`;
    h+=`<div class="list">${S.photos.map((it,i)=>`<div class="item"><img src="${thumbOf(it)}" alt=""><div class="nm"><b>Photo ${i+1}</b><span class="muted">copies</span></div>
      <div class="copies"><button class="iconbtn" data-a="copies" data-i="${i}" data-d="-1">${ic('minus')}</button><b>${it.copies}</b><button class="iconbtn" data-a="copies" data-i="${i}" data-d="1">${ic('plus')}</button></div>
      <button class="btn sm" data-a="maxcopies" data-i="${i}">Fill page</button></div>`).join('')}</div>`;
    h+=seg('L.orient',[['portrait','Page portrait'],['landscape','Page landscape']]);
    h+=seg('L.photo.align',[['center','Center'],['left','Left']]);
    h+=range('L.photo.gx','Horizontal spacing',0,20,0.5,' mm');
    h+=range('L.photo.gy','Vertical spacing',0,20,0.5,' mm');
    h+=range('L.m.photo','Margin',0,30,1,' mm');
  }
  $('#layPanel').innerHTML=h;
}
function pageChips(id,act){
  const n=buildPages().length,el=$(id);
  el.style.display=n>1?'flex':'none';
  el.innerHTML=n>1?Array.from({length:n},(_,i)=>`<button class="chip ${i===L.page?'on':''}" data-a="${act}" data-i="${i}">Page ${i+1}</button>`).join(''):'';
}
let layPg=null;
function drawLayout(){
  if(cur!=='layout'||!ready())return;
  const pages=buildPages();L.page=clamp(L.page,0,pages.length-1);layPg=pages[L.page];
  const wr=$('#layPrev'),cv=$('#layCanvas'),dpr=window.devicePixelRatio||1;
  const s=Math.min((wr.clientWidth-24)/layPg.W,(wr.clientHeight-24)/layPg.H);
  cv.style.width=layPg.W*s+'px';cv.style.height=layPg.H*s+'px';
  const out=renderPage(layPg,s*dpr,true);
  cv.width=out.width;cv.height=out.height;cv.getContext('2d').drawImage(out,0,0);
  pageChips('#layPages','page');
  let w=$('#layWarn');
  if(!w){w=document.createElement('div');w.id='layWarn';w.className='warn';}
  if(layPg.warn){w.textContent=layPg.warn;$('#layPanel').prepend(w);}else if(w.parentNode)w.remove();
}
hooks.layout=()=>{renderLayoutControls();requestAnimationFrame(drawLayout);};
(function bindLayout(){
  const cv=$('#layCanvas');let last=null,pend=false;
  cv.addEventListener('pointerdown',e=>{if(layPg&&layPg.drag){cv.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};}});
  cv.addEventListener('pointermove',e=>{
    if(!last||!layPg)return;
    const r=cv.getBoundingClientRect(),k=layPg.W/r.width,dx=(e.clientX-last.x)*k,dy=(e.clientY-last.y)*k;
    last={x:e.clientX,y:e.clientY};
    if(layPg.drag==='id'){L.id.dx+=dx;L.id.dy+=dy;}
    else if(layPg.drag==='a4'){layPg.item.pos.x+=dx;layPg.item.pos.y+=dy;}
    if(!pend){pend=true;requestAnimationFrame(()=>{pend=false;drawLayout();});}
  });
  const up=()=>{last=null;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
})();

/* ============ export screen ============ */
function drawExport(){
  if(cur!=='export'||!ready())return;
  const pages=buildPages();L.page=clamp(L.page,0,pages.length-1);const pg=pages[L.page];
  const cv=$('#expCanvas'),w=Math.min(window.innerWidth-48,560),dpr=window.devicePixelRatio||1;
  const out=renderPage(pg,(w/pg.W)*dpr,false);
  cv.width=out.width;cv.height=out.height;cv.style.width=w+'px';cv.style.height=(w*pg.H/pg.W)+'px';
  cv.getContext('2d').drawImage(out,0,0);
  pageChips('#expPages','epage');
  const n=pages.length;
  $('#pdfBtn').innerHTML=ic('dl')+'Save as PDF'+(n>1?` (${n} pages)`:'');
  $('#imgBtn').innerHTML=ic('photo')+'PNG';
  $('#shareBtn').innerHTML=ic('share')+'Share';
  $('#printBtn').innerHTML=ic('print')+'Print';
  let tip=`<b>Output:</b> A4 (210 × 297 mm) at 300 DPI, exactly as shown above.`;
  if(S.type==='id')tip+=L.id.mode==='actual'?`<br><b>Printing:</b> choose <b>Actual size / 100%</b> in the print dialog. Turn off “Fit to page” so the card prints at ${S.settings.idW} × ${S.settings.idH} mm.`:`<br><b>Note:</b> scaled cards will not be real size.`;
  else if(S.type==='photo')tip+=`<br><b>Printing:</b> use <b>100% / Actual size</b> so every photo prints at ${tileSize().w} × ${tileSize().h} mm.`;
  else tip+=`<br><b>Printing:</b> use A4 paper and <b>100%</b> scale for best results.`;
  $('#expTip').innerHTML=tip;
}
hooks.export=()=>requestAnimationFrame(drawExport);

const AND=()=>!!(window.Android&&typeof Android.saveFile==='function');
function blobB64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob);});}
function download(blob,name){
  if(AND()){blobB64(blob).then(b=>Android.saveFile(name,b,blob.type||'application/octet-stream'));return;}
  const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
}
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;};
const baseName=()=>'ScanPrint_'+({id:'ID',a4:'Document',photo:'Photos'}[S.type])+'_'+stamp();
function buildPDF(pgs){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length;};
  const obj=(id,fn)=>{offs[id]=len;push(`${id} 0 obj\n`);fn();push('\nendobj\n');};
  const n=pgs.length;
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${pgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>`));
  pgs.forEach((p,i)=>{
    const pid=3+3*i,cid=pid+1,iid=pid+2,w=p.wpt.toFixed(3),h=p.hpt.toFixed(3);
    const content=`q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.pw} /Height ${p.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);push(p.jpeg);push('\nendstream');});
  });
  const xr=len,total=3+3*n;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}
async function renderAll(kind){
  const pages=buildPages(),ppm=300/25.4,out=[];
  for(let i=0;i<pages.length;i++){
    loader(`Rendering page ${i+1} of ${pages.length} at 300 DPI…`);await raf();
    const c=renderPage(pages[i],ppm,false),pg=pages[i];
    if(kind==='png')out.push(await toBlob(c,'image/png'));
    else{const b=await toBlob(c,'image/jpeg',S.settings.quality);
      out.push({jpeg:new Uint8Array(await b.arrayBuffer()),pw:c.width,ph:c.height,wpt:pg.W/25.4*72,hpt:pg.H/25.4*72});}
    c.width=c.height=1;
  }
  return out;
}
async function doExport(kind){
  if(!ready()){toast('Add a document first');return;}
  try{
    if(kind==='png'){
      const bl=await renderAll('png');
      bl.forEach((b,i)=>setTimeout(()=>download(b,`${baseName()}${bl.length>1?'_p'+(i+1):''}.png`),i*400));
      hideLoader();toast(AND()?'Choose where to save':(bl.length>1?'Saving '+bl.length+' images…':'Image saved to Downloads'));
    }else{
      const pdf=buildPDF(await renderAll('pdf'));hideLoader();
      const name=baseName()+'.pdf';
      if(kind==='pdf'){download(pdf,name);toast(AND()?'Choose where to save the PDF':'PDF saved to Downloads');}
      else{
        if(AND()&&Android.shareFile){Android.shareFile(name,await blobB64(pdf),'application/pdf');return;}
        const f=new File([pdf],name,{type:'application/pdf'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){
          try{await navigator.share({files:[f],title:'ScanPrint'});}catch(e){if(e.name!=='AbortError')toast('Sharing failed. Use Save as PDF.');}
        }else toast("Sharing isn't supported here. Use Save as PDF.");
      }
    }
  }catch(err){console.error(err);hideLoader();toast('Export failed. Try again with fewer or smaller images.');}
}
async function doPrint(){
  if(!ready())return;
  if(window.Android&&Android.printPdf){
    try{const pdf=buildPDF(await renderAll('pdf'));hideLoader();Android.printPdf(baseName()+'.pdf',await blobB64(pdf));}
    catch(e){console.error(e);hideLoader();toast('Printing failed. Try Save as PDF.');}
    return;
  }
  try{
    loader('Preparing print…');await raf();
    const pages=buildPages(),pa=$('#printArea'),urls=[];pa.innerHTML='';
    for(const pg of pages){
      const c=renderPage(pg,300/25.4,false),b=await toBlob(c,'image/jpeg',0.95),u=URL.createObjectURL(b);urls.push(u);
      const im=new Image();im.src=u;im.className='pp '+(pg.W>pg.H?'land':'port');pa.appendChild(im);
      try{await im.decode();}catch(e){}c.width=c.height=1;await raf();
    }
    hideLoader();
    const clean=()=>{pa.innerHTML='';urls.forEach(u=>URL.revokeObjectURL(u));window.removeEventListener('afterprint',clean);};
    window.addEventListener('afterprint',clean);
    toast('In the print dialog choose A4 and 100% scale',3500);
    setTimeout(()=>window.print(),300);
  }catch(e){console.error(e);hideLoader();toast("Printing isn't available. Save a PDF and print it from your PDF viewer.");}
}

renderHome();
